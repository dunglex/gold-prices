name: Update Historical Gold Prices

on:
  schedule:
    # Runs once every day at 00:10 UTC
    - cron: '10 0 * * *'
  workflow_dispatch: # Keeps manual button enabled for testing

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - name: Download gold monthly prices
        run: bash download.sh
        working-directory: lich-su

      - name: Check if files changed
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.check-changes.outputs.has-changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          git commit -m "updated at $TIMESTAMP"
          git push
